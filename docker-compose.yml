services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "TechMove@12345"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    networks:
      - techmove-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  glms-backend-api:
    build:
      context: .
      dockerfile: TechMove.Api/Dockerfile
    container_name: glms-backend-api
    depends_on:
      sql-server-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=TechMoveDb;User Id=sa;Password=TechMove@12345;TrustServerCertificate=True;MultipleActiveResultSets=true"
      ExchangeRateApi__BaseUrl: "https://v6.exchangerate-api.com/v6"
      ExchangeRateApi__ApiKey: "b24f1c18771f1fe939e085a9"
    ports:
      - "7189:8080"
    volumes:
      - ./TechMove.Api/firebase-service-account.json:/app/firebase-service-account.json:ro
      - apiuploads:/app/wwwroot/uploads/agreements
    networks:
      - techmove-network

  glms-frontend-web:
    build:
      context: .
      dockerfile: TechMove/Dockerfile
    container_name: glms-frontend-web
    depends_on:
      - glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ApiSettings__BaseUrl: "http://glms-backend-api:8080/"
      Firebase__ApiKey: "AIzaSyCau_UVZZ2Kkqi-elisD1XF3SC_a0mUc00"
    ports:
      - "7139:8080"
    networks:
      - techmove-network

volumes:
  sqlserverdata:
  apiuploads:

networks:
  techmove-network:
    driver: bridge